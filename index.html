<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ひとひ帳</title>
<meta name="theme-color" content="#1A1E2C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ひとひ帳" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1A1E2C; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  textarea:focus, input:focus { border-color: #E3A552 !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo } = React;

/* ============ 色とフォント ============ */
const C = {
  bg: "#1A1E2C", panel: "#232939", line: "#313A52",
  card: "#F6F0E1", card2: "#F3E8DA", cardLine: "#E2D7BF",
  ink: "#3B342A", inkSoft: "#84796A",
  amber: "#E3A552", amberDark: "#B97F33", plum: "#C96F5E",
  textOnDark: "#EAE5D7", mutedOnDark: "#8E96AB",
  green: "#7FA96B", greenDark: "#5E8A4C",
};
const DISPLAY = "'Shippori Mincho', serif";
const BODY = "'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif";

/* ============ 日付 ============ */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WD = ["日","月","火","水","木","金","土"];
const fmtLong = (k) => { const d = fromKey(k); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const fmtShort = (k) => { const d = fromKey(k); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtTime = (iso) => { const d = new Date(iso); return `${d.getHours()}:${pad(d.getMinutes())}`; };
const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekDaysOf = (mk) => Array.from({length:7}, (_,i) => toKey(addDays(fromKey(mk), i)));
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0,4), +m.slice(5,7)-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthLabel = (m) => `${m.slice(0,4)}年${+m.slice(5,7)}月`;

/* ============ 投稿の種類 ============ */
const TYPES = {
  thanks: { icon: "🧡", label: "ありがとう", color: C.plum, ph: "誰に・何にありがとう？ ひと言でOK" },
  memo:   { icon: "📝", label: "メモ",       color: C.amberDark, ph: "思いついたこと、気づいたこと" },
  diary:  { icon: "📔", label: "日記",       color: C.greenDark, ph: "いま起きたこと、感じたこと" },
};

const PROMPTS = [
  "今日、誰かに優しくできた？","感情的にならずにいられた？","今日いちばん笑ったのはいつ？",
  "誰かの話を最後まで聴けた？","自分に正直でいられた？","今日、小さな挑戦をした？",
  "誰かの良いところを見つけた？","「ありがとう」をちゃんと言葉にできた？","今日の自分を褒めるなら？",
  "無理してなかった？","誰かを助けたり、助けられたりした？","今日、心が動いた瞬間は？",
  "明日の自分に残したい気持ちは？","今日、手放せたこと・許せたことは？",
];
const promptFor = (k) => {
  const d = fromKey(k);
  const doy = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return PROMPTS[doy % PROMPTS.length];
};

const MOODS = ["😄","🙂","😐","😮‍💨","😢"];
const MOOD_VAL = { "😄":5, "🙂":4, "😐":3, "😮‍💨":2, "😢":1 };
const moodEmojiFor = (v) => v>=4.5?"😄":v>=3.5?"🙂":v>=2.5?"😐":v>=1.5?"😮‍💨":"😢";
const habitFreq = (h) => h.freq || "daily";

/* ============ 保存（端末） ============ */
const LS = "hitohi:v4";
const LS_URL = "hitohi:gasUrl";

function migrate_() {
  // 旧バージョン（v2/v3）の記録を「流れ」に引っ越し
  const posts = [], days = {}, weeks = {};
  let habits = [], wishlist = [];
  const push = (date, type, text, photo, order) => {
    if (!text && !photo) return;
    const d = fromKey(date);
    d.setHours(21, order || 0, 0, 0);
    posts.push({ id: `p${d.getTime()}${Math.random().toString(36).slice(2,6)}`, ts: d.toISOString(), date, type, text: text || "", photo: photo || null });
  };
  try {
    const v3 = JSON.parse(localStorage.getItem("hitohi:v3") || "null");
    if (v3) {
      Object.values(v3.entries || {}).forEach((e) => {
        push(e.date, "diary", e.diary, e.photo, 1);
        push(e.date, "thanks", e.gratitude, null, 2);
        if (e.promptAnswer) push(e.date, "diary", `「${promptFor(e.date)}」→ ${e.promptAnswer}`, null, 3);
        days[e.date] = { mood: e.mood || null, habitChecks: e.habitChecks || {} };
      });
      Object.values(v3.weeks || {}).forEach((w) => { weeks[w.mondayKey] = w; });
      habits = v3.habits || []; wishlist = v3.wishlist || [];
    } else {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("hitohi:")) continue;
        let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
        if (k.startsWith("hitohi:entry:")) {
          const date = k.slice(13);
          push(date, "diary", v.diary, v.photo, 1);
          push(date, "thanks", v.gratitude, null, 2);
          if (v.promptAnswer) push(date, "diary", `「${promptFor(date)}」→ ${v.promptAnswer}`, null, 3);
          days[date] = { mood: v.mood || null, habitChecks: v.habitChecks || {} };
        } else if (k === "hitohi:habits") habits = v || [];
        else if (k === "hitohi:wishlist") wishlist = v || [];
        else if (k.startsWith("hitohi:weekgoal:")) {
          const m = k.slice(16);
          weeks[m] = { ...(weeks[m]||{mondayKey:m}), goalText: (v&&v.text)||"", goalAchieved: !!(v&&v.achieved) };
        } else if (k.startsWith("hitohi:review:")) {
          const m = k.slice(14);
          weeks[m] = { ...(weeks[m]||{mondayKey:m}), wins:(v&&v.wins)||"", insight:(v&&v.insight)||"", nextWeek:(v&&v.nextWeek)||"" };
        }
      }
    }
  } catch (e) {}
  posts.sort((a,b) => (a.ts < b.ts ? 1 : -1));
  return { posts, days, weeks, habits, wishlist, synced: {} };
}

function load_() {
  try {
    const raw = localStorage.getItem(LS);
    if (raw) {
      const d = JSON.parse(raw);
      return { posts: d.posts||[], days: d.days||{}, weeks: d.weeks||{}, habits: d.habits||[], wishlist: d.wishlist||[], synced: d.synced||{} };
    }
  } catch (e) {}
  return migrate_();
}

/* ============ 写真圧縮 ============ */
const compressImage = (file) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const max = 800; let { width, height } = img;
      if (width > max || height > max) { const s = Math.min(max/width, max/height); width = Math.round(width*s); height = Math.round(height*s); }
      const cv = document.createElement("canvas"); cv.width = width; cv.height = height;
      cv.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(cv.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = reject; img.src = e.target.result;
  };
  r.onerror = reject; r.readAsDataURL(file);
});

/* ============ 共通パーツ ============ */
const Card = ({ children, style }) => (
  <div style={{ background: C.card, border: `1px solid ${C.cardLine}`, borderRadius: 16, padding: 16, color: C.ink, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", ...style }}>{children}</div>
);
const Label = ({ children }) => (
  <div style={{ fontSize: 11, letterSpacing: "0.12em", color: C.inkSoft, marginBottom: 6, fontWeight: 700 }}>{children}</div>
);
const inputStyle = {
  width: "100%", background: "#FFFDF6", border: "1px solid #E2D7BF", borderRadius: 10,
  padding: "10px 12px", fontSize: 15, color: C.ink, fontFamily: BODY, outline: "none",
};
const navArrow = { background:"#232939", border:"1px solid #313A52", color:"#EAE5D7", borderRadius:10, width:38, height:38, fontSize:20, cursor:"pointer", fontFamily:BODY };
const Photo = (p) => <img alt="" referrerPolicy="no-referrer" {...p} />;

/* ============ 本体 ============ */
function App() {
  const todayKey = toKey(new Date());
  const [tab, setTab] = useState("flow");
  const [sub, setSub] = useState("week");

  const [db, setDb] = useState(load_);
  const dbRef = useRef(db);
  useEffect(() => {
    dbRef.current = db;
    try { localStorage.setItem(LS, JSON.stringify(db)); }
    catch (e) { alert("端末の保存容量がいっぱいかも。設定タブでバックアップを書き出して、古い写真を減らしてね"); }
  }, [db]);

  const [gasUrl, setGasUrl] = useState(localStorage.getItem(LS_URL) || "");
  const [urlDraft, setUrlDraft] = useState(localStorage.getItem(LS_URL) || "");
  const [syncMsg, setSyncMsg] = useState("");

  const [type, setType] = useState("thanks");
  const [text, setText] = useState("");
  const [photo, setPhoto] = useState(null);
  const [flash, setFlash] = useState("");

  const [weekOffset, setWeekOffset] = useState(0);
  const curMonday = toKey(addDays(mondayOf(new Date()), weekOffset*7));
  const [weekDraft, setWeekDraft] = useState(db.weeks[curMonday] || { mondayKey: curMonday, goalText:"", goalAchieved:false, wins:"", insight:"", nextWeek:"" });
  useEffect(() => {
    setWeekDraft(dbRef.current.weeks[curMonday] || { mondayKey: curMonday, goalText:"", goalAchieved:false, wins:"", insight:"", nextWeek:"" });
  }, [curMonday]);

  const [monthKey, setMonthKey] = useState(todayKey.slice(0,7));
  const [showDays, setShowDays] = useState(7);
  const [newWish, setNewWish] = useState("");
  const [newHabit, setNewHabit] = useState("");
  const [newFreq, setNewFreq] = useState("daily");
  const [newTarget, setNewTarget] = useState(3);

  const say = (m) => { setFlash(m); setTimeout(() => setFlash(""), 1600); };

  /* ---- シート送信（任意・失敗しても端末には残る） ---- */
  const pushRemote = async (payload) => {
    if (!gasUrl) return;
    try {
      await fetch(gasUrl, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    } catch (e) {}
  };

  /* ---- 投稿する ---- */
  const submit = () => {
    if (!text.trim() && !photo) return;
    const now = new Date();
    const p = { id:`p${now.getTime()}`, ts: now.toISOString(), date: toKey(now), type, text: text.trim(), photo };
    setDb((d) => ({ ...d, posts: [p, ...d.posts] }));
    setText(""); setPhoto(null);
    say(TYPES[type].icon + " 記録したよ");
    pushRemote({ action:"addPost", post: p });
  };

  const delPost = (id) => {
    if (!window.confirm("この記録を削除する？")) return;
    setDb((d) => ({ ...d, posts: d.posts.filter((p) => p.id !== id) }));
    pushRemote({ action:"deletePost", id });
  };

  const onPhotoPick = async (file) => {
    if (!file) return;
    try { setPhoto(await compressImage(file)); } catch (e) { alert("写真の読み込みに失敗しました"); }
  };

  /* ---- 習慣・気分（タップで即保存） ---- */
  const toggleHabit = (id) => {
    setDb((d) => {
      const cur = d.days[todayKey] || { mood:null, habitChecks:{} };
      const next = { ...cur, habitChecks: { ...cur.habitChecks, [id]: !cur.habitChecks[id] } };
      pushRemote({ action:"saveDay", date: todayKey, day: next });
      return { ...d, days: { ...d.days, [todayKey]: next } };
    });
  };
  const setMood = (m) => {
    setDb((d) => {
      const cur = d.days[todayKey] || { mood:null, habitChecks:{} };
      const next = { ...cur, mood: cur.mood === m ? null : m };
      pushRemote({ action:"saveDay", date: todayKey, day: next });
      return { ...d, days: { ...d.days, [todayKey]: next } };
    });
  };

  const saveWeek = () => {
    const w = { ...weekDraft, mondayKey: curMonday };
    setDb((d) => ({ ...d, weeks: { ...d.weeks, [curMonday]: w } }));
    pushRemote({ action:"saveWeek", week: w });
    say("📖 振り返りを保存したよ");
  };

  const saveHabits = (next) => { setDb((d) => ({ ...d, habits: next })); pushRemote({ action:"saveHabits", habits: next }); };
  const saveWishlist = (next) => { setDb((d) => ({ ...d, wishlist: next })); pushRemote({ action:"saveWishlist", wishlist: next }); };

  /* ---- バックアップ ---- */
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(dbRef.current)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ひとひ帳バックアップ_${todayKey}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const importBackup = (file) => {
    if (!file) return;
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (!d.posts) throw new Error("形式が違うみたい");
        if (window.confirm("いまの記録を、このバックアップで置き換える？")) { setDb(d); say("読み込んだよ"); }
      } catch (err) { alert("読み込めなかった…: " + err.message); }
    };
    r.readAsText(file);
  };

  const testConnection = async () => {
    const u = urlDraft.trim();
    if (!u) { setSyncMsg("URLを入れてね"); return; }
    setSyncMsg("接続中…");
    try {
      const r = await (await fetch(u + "?action=ping")).json();
      if (r.ok) { localStorage.setItem(LS_URL, u); setGasUrl(u); setSyncMsg("✓ 接続OK！これから書く記録はシートにも残るよ"); }
      else setSyncMsg("✗ 応答が変: " + (r.error||""));
    } catch (e) { setSyncMsg("✗ 接続できない… URLとデプロイ設定（アクセス=全員）を確認してね"); }
  };
  const pushAll = async () => {
    if (!gasUrl) return;
    setSyncMsg("送信中…");
    const d = dbRef.current;
    await pushRemote({ action:"bulk", posts: d.posts, days: d.days, weeks: d.weeks, habits: d.habits, wishlist: d.wishlist });
    setSyncMsg("✓ いまの記録を全部シートへ送ったよ");
  };

  /* ---- 派生 ---- */
  const postsByDate = useMemo(() => {
    const m = {};
    db.posts.forEach((p) => { (m[p.date] = m[p.date] || []).push(p); });
    Object.values(m).forEach((a) => a.sort((x,y) => (x.ts < y.ts ? 1 : -1)));
    return m;
  }, [db.posts]);

  const flowDates = useMemo(() => {
    const s = new Set(Object.keys(postsByDate));
    s.add(todayKey);
    return Array.from(s).sort().reverse();
  }, [postsByDate, todayKey]);

  const thanksPosts = useMemo(() => db.posts.filter((p) => p.type === "thanks"), [db.posts]);

  const onThisDay = useMemo(() => {
    const d = fromKey(todayKey); const out = [];
    for (let y = 1; y <= 10; y++) {
      const k = `${d.getFullYear()-y}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      if (postsByDate[k] && postsByDate[k].length) out.push({ y, posts: postsByDate[k] });
    }
    return out;
  }, [postsByDate, todayKey]);

  const weeklyCount = (h, mk) => {
    let c = 0;
    weekDaysOf(mk).forEach((k) => { const day = db.days[k]; if (day && day.habitChecks && day.habitChecks[h.id]) c++; });
    return c;
  };

  /* ============ 投稿カード ============ */
  const PostCard = ({ p, compact }) => {
    const t = TYPES[p.type] || TYPES.memo;
    return (
      <div style={{ background:"#FFFDF6", border:`1px solid ${C.cardLine}`, borderLeft:`4px solid ${t.color}`,
        borderRadius:10, padding:"10px 12px", display:"flex", gap:10, alignItems:"flex-start" }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, color:C.inkSoft, fontWeight:700, marginBottom:3 }}>
            {t.icon} {compact ? fmtShort(p.date) + " " : ""}{fmtTime(p.ts)}
          </div>
          {p.text && <div style={{ fontSize:15, lineHeight:1.7, color:C.ink, whiteSpace:"pre-wrap", wordBreak:"break-word" }}>{p.text}</div>}
          {p.photo && <Photo src={p.photo} style={{ width:"100%", borderRadius:8, marginTop:8, display:"block" }} />}
        </div>
        <button onClick={() => delPost(p.id)} aria-label="削除"
          style={{ background:"none", border:"none", color:"#C9C0AC", fontSize:16, cursor:"pointer", padding:2, flexShrink:0 }}>×</button>
      </div>
    );
  };

  /* ============ タブ：流れ ============ */
  const renderFlow = () => {
    const today = db.days[todayKey] || { mood:null, habitChecks:{} };
    const dates = flowDates.slice(0, showDays);
    const t = TYPES[type];

    return (
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {/* 入力 */}
        <Card style={{ padding:14 }}>
          <div style={{ display:"flex", gap:6, marginBottom:10 }}>
            {Object.keys(TYPES).map((k) => (
              <button key={k} onClick={() => setType(k)}
                style={{ flex:1, padding:"8px 0", borderRadius:10, cursor:"pointer", fontFamily:BODY, fontSize:13, fontWeight:700,
                  border:`2px solid ${type===k ? TYPES[k].color : C.cardLine}`,
                  background: type===k ? "#F0E4CB" : "#FFFDF6", color: type===k ? TYPES[k].color : C.inkSoft }}>
                {TYPES[k].icon} {TYPES[k].label}
              </button>
            ))}
          </div>
          <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={t.ph} rows={2}
            style={{ ...inputStyle, resize:"vertical", lineHeight:1.7 }} />
          {photo && (
            <div style={{ position:"relative", marginTop:8 }}>
              <Photo src={photo} style={{ width:"100%", borderRadius:10, display:"block" }} />
              <button onClick={() => setPhoto(null)}
                style={{ position:"absolute", top:6, right:6, background:"rgba(26,30,44,0.75)", color:"#fff", border:"none",
                  borderRadius:8, padding:"5px 9px", fontSize:12, fontFamily:BODY, cursor:"pointer" }}>削除</button>
            </div>
          )}
          <div style={{ display:"flex", gap:8, marginTop:10 }}>
            <label style={{ width:48, display:"flex", alignItems:"center", justifyContent:"center",
              border:`1px solid ${C.cardLine}`, borderRadius:10, background:"#FFFDF6", cursor:"pointer", fontSize:18 }}>
              📷<input type="file" accept="image/*" style={{ display:"none" }} onChange={(e) => onPhotoPick(e.target.files && e.target.files[0])} />
            </label>
            <button onClick={submit} disabled={!text.trim() && !photo}
              style={{ flex:1, background: (!text.trim() && !photo) ? "#D9CDB4" : C.amber, color:"#2A2313", border:"none",
                borderRadius:10, padding:"12px 0", fontSize:15, fontWeight:700, fontFamily:BODY,
                cursor:(!text.trim() && !photo) ? "default" : "pointer" }}>
              記録する
            </button>
          </div>
          <div style={{ fontSize:11, color:C.inkSoft, marginTop:8, textAlign:"center" }}>1日に何回でもOK。押した瞬間に保存されるよ</div>
        </Card>

        {/* 習慣＋気分 */}
        <Card style={{ padding:14 }}>
          <div style={{ display:"flex", gap:6, justifyContent:"space-between", marginBottom:10 }}>
            {MOODS.map((m) => (
              <button key={m} onClick={() => setMood(m)}
                style={{ flex:1, fontSize:22, padding:"5px 0", borderRadius:10,
                  border:`2px solid ${today.mood===m ? C.amber : "transparent"}`,
                  background: today.mood===m ? "#F0E4CB" : "#FFFDF6", cursor:"pointer",
                  filter: today.mood && today.mood!==m ? "grayscale(0.7) opacity(0.6)" : "none" }}>{m}</button>
            ))}
          </div>
          {db.habits.length === 0 ? (
            <div style={{ fontSize:13, color:C.inkSoft, textAlign:"center" }}>
              習慣は<button onClick={() => setTab("settings")} style={{ background:"none", border:"none", color:C.amberDark, fontWeight:700, cursor:"pointer", fontFamily:BODY, fontSize:13, padding:0 }}>設定タブ</button>から追加できるよ
            </div>
          ) : (
            <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
              {db.habits.map((h) => {
                const done = !!today.habitChecks[h.id];
                const weekly = habitFreq(h) === "weekly";
                const c = weekly ? weeklyCount(h, toKey(mondayOf(new Date()))) : 0;
                return (
                  <button key={h.id} onClick={() => toggleHabit(h.id)}
                    style={{ padding:"7px 12px", borderRadius:999, cursor:"pointer", fontFamily:BODY, fontSize:13, fontWeight:700,
                      border:`1.5px solid ${done ? C.amberDark : C.cardLine}`,
                      background: done ? C.amber : "#FFFDF6", color: done ? "#2A2313" : C.inkSoft }}>
                    {done ? "✓ " : ""}{h.name}
                    {weekly && <span style={{ fontSize:11, opacity:0.85 }}> {c}/{h.target||1}</span>}
                  </button>
                );
              })}
            </div>
          )}
        </Card>

        {/* 今日の問い */}
        <Card style={{ background:C.card2, padding:14 }}>
          <Label>人として — きょうの問い</Label>
          <div style={{ fontFamily:DISPLAY, fontSize:16, fontWeight:600, color:C.ink, marginBottom:8 }}>「{promptFor(todayKey)}」</div>
          <button onClick={() => { setType("diary"); setText(`「${promptFor(todayKey)}」→ `); window.scrollTo({ top:0, behavior:"smooth" }); }}
            style={{ background:"#FFFDF6", border:`1px solid ${C.cardLine}`, borderRadius:10, padding:"9px 0", width:"100%",
              fontFamily:BODY, fontSize:14, fontWeight:700, color:C.amberDark, cursor:"pointer" }}>
            この問いに答える
          </button>
        </Card>

        {/* ◯年前の今日 */}
        {onThisDay.map(({ y, posts }) => (
          <div key={y} style={{ background:C.panel, border:`1px solid ${C.line}`, borderRadius:12, padding:"10px 14px" }}>
            <div style={{ fontSize:10, color:C.amber, letterSpacing:"0.1em", fontWeight:700, marginBottom:4 }}>⏪ {y}年前の今日</div>
            {posts.slice(0,3).map((p) => (
              <div key={p.id} style={{ fontSize:13, color:C.textOnDark, lineHeight:1.6 }}>
                {(TYPES[p.type]||TYPES.memo).icon} {p.text || "（写真）"}
              </div>
            ))}
          </div>
        ))}

        {/* 流れ */}
        {dates.map((k) => (
          <div key={k} style={{ display:"flex", flexDirection:"column", gap:8 }}>
            <div style={{ fontFamily:DISPLAY, fontSize:15, color: k===todayKey ? C.amber : C.mutedOnDark, fontWeight:700, marginTop:4 }}>
              {k === todayKey ? "きょう" : fmtLong(k)}
              {db.days[k] && db.days[k].mood ? ` ${db.days[k].mood}` : ""}
            </div>
            {(postsByDate[k] || []).length === 0 ? (
              <div style={{ fontSize:13, color:C.mutedOnDark, paddingLeft:4 }}>まだ記録なし。ひと言からどうぞ🍜</div>
            ) : (
              postsByDate[k].map((p) => <PostCard key={p.id} p={p} />)
            )}
          </div>
        ))}
        {flowDates.length > showDays && (
          <button onClick={() => setShowDays((n) => n + 14)}
            style={{ background:C.panel, border:`1px solid ${C.line}`, color:C.textOnDark, borderRadius:12,
              padding:"12px 0", fontFamily:BODY, fontSize:14, cursor:"pointer" }}>
            もっと前を見る
          </button>
        )}
      </div>
    );
  };

  /* ============ 振り返り：週 ============ */
  const renderWeek = () => {
    const days = weekDaysOf(curMonday);
    const wPosts = days.flatMap((k) => postsByDate[k] || []);
    const dailyH = db.habits.filter((h) => habitFreq(h)==="daily");
    const weeklyH = db.habits.filter((h) => habitFreq(h)==="weekly");

    let scores = [];
    dailyH.forEach((h) => { let c=0; days.forEach((k)=>{ const d=db.days[k]; if(d&&d.habitChecks&&d.habitChecks[h.id]) c++; }); scores.push(c/7); });
    weeklyH.forEach((h) => { let c=0; days.forEach((k)=>{ const d=db.days[k]; if(d&&d.habitChecks&&d.habitChecks[h.id]) c++; }); scores.push(Math.min(c/(h.target||1),1)); });
    const pct = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100) : 0;

    const dotRow = (h) => (
      <div key={h.id} style={{ display:"flex", alignItems:"center" }}>
        <div style={{ flex:1, fontSize:13, color:C.ink, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", paddingRight:6 }}>{h.name}</div>
        {days.map((k) => {
          const d = db.days[k];
          const on = d && d.habitChecks && d.habitChecks[h.id];
          return (
            <div key={k} style={{ width:26, display:"flex", justifyContent:"center" }}>
              <div style={{ width:14, height:14, borderRadius:"50%", background: on ? C.amber : "transparent",
                border:`2px solid ${on ? C.amberDark : (k>todayKey ? "#EEE7D2" : C.cardLine)}` }} />
            </div>
          );
        })}
      </div>
    );

    const section = (tk) => {
      const list = wPosts.filter((p) => p.type === tk);
      if (!list.length) return null;
      const t = TYPES[tk];
      return (
        <Card style={tk==="thanks" ? { background:C.card2 } : undefined}>
          <Label>{t.icon} この週の{t.label}（{list.length}件）</Label>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {list.map((p) => <PostCard key={p.id} p={p} compact />)}
          </div>
        </Card>
      );
    };

    return (
      <React.Fragment>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <button onClick={() => setWeekOffset((o)=>o-1)} style={navArrow}>‹</button>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontFamily:DISPLAY, fontSize:19, color:C.textOnDark, fontWeight:600 }}>{fmtShort(days[0])} 〜 {fmtShort(days[6])}</div>
            <div style={{ fontSize:12, color:C.mutedOnDark }}>{weekOffset===0?"今週":weekOffset===-1?"先週":`${-weekOffset}週間前`}・記録{wPosts.length}件</div>
          </div>
          <button onClick={() => weekOffset<0 && setWeekOffset((o)=>o+1)} style={{ ...navArrow, opacity: weekOffset<0?1:0.25 }} disabled={weekOffset>=0}>›</button>
        </div>

        <Card style={{ background:C.card2 }}>
          <Label>🎯 この週の目標</Label>
          <input value={weekDraft.goalText} onChange={(e)=>setWeekDraft((w)=>({...w, goalText:e.target.value}))}
            placeholder="例：面接で候補者の話を最後まで聴く" style={inputStyle} />
          {weekDraft.goalText.trim() && (
            <button onClick={()=>setWeekDraft((w)=>({...w, goalAchieved:!w.goalAchieved}))}
              style={{ marginTop:10, width:"100%", background: weekDraft.goalAchieved?"#E4EEDB":"#FFFDF6",
                border:`1px solid ${weekDraft.goalAchieved?C.green:C.cardLine}`, borderRadius:10, padding:"9px 0",
                cursor:"pointer", fontFamily:BODY, fontSize:14, fontWeight:700, color: weekDraft.goalAchieved?C.greenDark:C.inkSoft }}>
              {weekDraft.goalAchieved ? "達成できた！🎉" : "達成できたらタップ"}
            </button>
          )}
        </Card>

        {db.habits.length > 0 && (
          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline" }}>
              <Label>習慣の達成</Label>
              <div style={{ fontFamily:DISPLAY, fontSize:24, fontWeight:700, color:C.amberDark }}>{pct}<span style={{fontSize:13}}>%</span></div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:10, marginTop:4 }}>
              <div style={{ display:"flex" }}>
                <div style={{ flex:1 }} />
                {days.map((k)=>(
                  <div key={k} style={{ width:26, textAlign:"center", fontSize:10, color: k===todayKey?C.amberDark:C.inkSoft, fontWeight: k===todayKey?700:400 }}>
                    {WD[fromKey(k).getDay()]}
                  </div>
                ))}
              </div>
              {dailyH.map(dotRow)}
              {weeklyH.length > 0 && (
                <React.Fragment>
                  <div style={{ fontSize:11, color:C.inkSoft, fontWeight:700, letterSpacing:"0.1em" }}>週の習慣</div>
                  {weeklyH.map((h)=>{
                    let c=0; days.forEach((k)=>{ const d=db.days[k]; if(d&&d.habitChecks&&d.habitChecks[h.id]) c++; });
                    const met = c >= (h.target||1);
                    return (
                      <div key={h.id}>
                        {dotRow(h)}
                        <div style={{ textAlign:"right", fontSize:12, fontWeight:700, color: met?C.greenDark:C.inkSoft }}>{c}/{h.target||1}{met?" 達成 ✓":""}</div>
                      </div>
                    );
                  })}
                </React.Fragment>
              )}
            </div>
          </Card>
        )}

        {section("thanks")}
        {section("diary")}
        {section("memo")}

        <Card>
          <Label>週の振り返りメモ</Label>
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {[["wins","✨ できたこと・よかったこと"],["insight","🌱 人として気づいたこと"],["nextWeek","🍜 来週の自分へ"]].map(([k,lab])=>(
              <div key={k}>
                <div style={{ fontSize:13, fontWeight:700, color:C.ink, marginBottom:5 }}>{lab}</div>
                <textarea value={weekDraft[k]||""} onChange={(e)=>setWeekDraft((w)=>({...w,[k]:e.target.value}))} rows={2}
                  style={{ ...inputStyle, resize:"vertical", lineHeight:1.7 }} />
              </div>
            ))}
            <button onClick={saveWeek}
              style={{ background:C.amber, color:"#2A2313", border:"none", borderRadius:14, padding:"13px 0",
                fontSize:15, fontWeight:700, fontFamily:BODY, cursor:"pointer" }}>
              目標と振り返りを保存する
            </button>
          </div>
        </Card>
      </React.Fragment>
    );
  };

  /* ============ 振り返り：月別 ============ */
  const renderMonth = () => {
    const dates = Object.keys(postsByDate).filter((k)=>k.startsWith(monthKey)).sort().reverse();
    const curMonth = todayKey.slice(0,7);
    const total = dates.reduce((n,k)=>n+postsByDate[k].length, 0);
    return (
      <React.Fragment>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <button onClick={()=>setMonthKey((m)=>shiftMonth(m,-1))} style={navArrow}>‹</button>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontFamily:DISPLAY, fontSize:19, color:C.textOnDark, fontWeight:600 }}>{monthLabel(monthKey)}</div>
            <div style={{ fontSize:12, color:C.mutedOnDark }}>{dates.length}日・{total}件</div>
          </div>
          <button onClick={()=>monthKey<curMonth && setMonthKey((m)=>shiftMonth(m,1))} style={{ ...navArrow, opacity: monthKey<curMonth?1:0.25 }} disabled={monthKey>=curMonth}>›</button>
        </div>
        {dates.length === 0 ? (
          <Card><div style={{ color:C.inkSoft, fontSize:14, textAlign:"center", padding:8 }}>この月の記録はまだないよ</div></Card>
        ) : dates.map((k)=>(
          <Card key={k}>
            <Label>{fmtLong(k)} {db.days[k]&&db.days[k].mood ? db.days[k].mood : ""}</Label>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {postsByDate[k].map((p)=><PostCard key={p.id} p={p} />)}
            </div>
          </Card>
        ))}
      </React.Fragment>
    );
  };

  /* ============ 振り返り：グラフ ============ */
  const renderGraph = () => {
    const byMonth = {};
    db.posts.forEach((p)=>{
      const m = p.date.slice(0,7);
      const s = byMonth[m] || (byMonth[m] = { posts:0, thanks:0, dates:new Set() });
      s.posts++; s.dates.add(p.date);
      if (p.type==="thanks") s.thanks++;
    });
    Object.entries(db.days).forEach(([k,d])=>{
      const m = k.slice(0,7);
      const s = byMonth[m] || (byMonth[m] = { posts:0, thanks:0, dates:new Set() });
      s.moodSum = (s.moodSum||0) + (d.mood ? MOOD_VAL[d.mood]||0 : 0);
      s.moodN = (s.moodN||0) + (d.mood ? 1 : 0);
      s.checks = (s.checks||0) + Object.values(d.habitChecks||{}).filter(Boolean).length;
    });
    const months = Object.keys(byMonth).sort().slice(-12);
    const maxP = Math.max(1, ...months.map((m)=>byMonth[m].posts));

    const yearAgo = toKey(addDays(new Date(), -365));
    const habitTotals = db.habits.map((h)=>{
      let c=0; Object.entries(db.days).forEach(([k,d])=>{ if(k>=yearAgo && d.habitChecks && d.habitChecks[h.id]) c++; });
      return { h, c };
    }).sort((a,b)=>b.c-a.c);
    const maxH = Math.max(1, ...habitTotals.map((x)=>x.c));

    const Big = ({n,l}) => (
      <div style={{ flex:1, textAlign:"center" }}>
        <div style={{ fontFamily:DISPLAY, fontSize:26, fontWeight:700, color:C.amberDark }}>{n}</div>
        <div style={{ fontSize:11, color:C.inkSoft }}>{l}</div>
      </div>
    );

    return (
      <React.Fragment>
        <Card>
          <div style={{ display:"flex" }}>
            <Big n={db.posts.length} l="記録した数" />
            <Big n={thanksPosts.length} l="ありがとう" />
            <Big n={db.wishlist.filter((w)=>w.doneAt).length} l="叶ったこと" />
          </div>
        </Card>
        <Card>
          <Label>月ごとのあゆみ</Label>
          {months.length===0 ? (
            <div style={{ color:C.inkSoft, fontSize:14, textAlign:"center", padding:8 }}>記録がたまると、ここに変化が出てくるよ📈</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              <div style={{ display:"flex", fontSize:10, color:C.inkSoft, fontWeight:700 }}>
                <div style={{ width:62 }} /><div style={{ flex:1 }}>記録数</div>
                <div style={{ width:36, textAlign:"center" }}>日数</div>
                <div style={{ width:32, textAlign:"center" }}>気分</div>
                <div style={{ width:32, textAlign:"center" }}>🧡</div>
              </div>
              {months.map((m)=>{
                const s = byMonth[m];
                const avg = s.moodN ? s.moodSum/s.moodN : null;
                return (
                  <div key={m} style={{ display:"flex", alignItems:"center" }}>
                    <div style={{ width:62, fontSize:12, color:C.ink, fontWeight:700 }}>{m.slice(2,4)}年{+m.slice(5,7)}月</div>
                    <div style={{ flex:1, background:"#EFE8D5", borderRadius:6, height:14, overflow:"hidden" }}>
                      <div style={{ width:`${Math.round(s.posts/maxP*100)}%`, minWidth: s.posts?8:0, height:"100%", background:C.amber, borderRadius:6 }} />
                    </div>
                    <div style={{ width:36, textAlign:"center", fontSize:12, color:C.inkSoft }}>{s.dates.size}</div>
                    <div style={{ width:32, textAlign:"center", fontSize:14 }}>{avg?moodEmojiFor(avg):"—"}</div>
                    <div style={{ width:32, textAlign:"center", fontSize:12, color:C.plum, fontWeight:700 }}>{s.thanks}</div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
        {habitTotals.length>0 && (
          <Card>
            <Label>習慣の実施回数（過去1年）</Label>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {habitTotals.map(({h,c})=>(
                <div key={h.id}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:3 }}>
                    <span style={{ color:C.ink }}>{h.name}</span>
                    <span style={{ color:C.amberDark, fontWeight:700 }}>{c}回</span>
                  </div>
                  <div style={{ background:"#EFE8D5", borderRadius:6, height:10, overflow:"hidden" }}>
                    <div style={{ width:`${Math.round(c/maxH*100)}%`, minWidth:c?6:0, height:"100%", background: habitFreq(h)==="daily"?C.amber:C.green, borderRadius:6 }} />
                  </div>
                </div>
              ))}
            </div>
          </Card>
        )}
      </React.Fragment>
    );
  };

  const renderReview = () => (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <div style={{ display:"flex", background:C.panel, borderRadius:12, padding:4, border:`1px solid ${C.line}` }}>
        {[["week","週"],["month","月別"],["graph","グラフ"]].map(([id,l])=>(
          <button key={id} onClick={()=>setSub(id)}
            style={{ flex:1, padding:"8px 0", borderRadius:9, border:"none", cursor:"pointer", fontFamily:BODY, fontSize:13, fontWeight:700,
              background: sub===id?C.amber:"transparent", color: sub===id?"#2A2313":C.mutedOnDark }}>{l}</button>
        ))}
      </div>
      {sub==="week" && renderWeek()}
      {sub==="month" && renderMonth()}
      {sub==="graph" && renderGraph()}
    </div>
  );

  /* ============ ありがとう ============ */
  const renderThanks = () => (
    <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
      <div style={{ textAlign:"center", padding:"6px 0 2px" }}>
        <div style={{ fontSize:34 }}>🧡</div>
        <div style={{ fontFamily:DISPLAY, fontSize:20, color:C.textOnDark, fontWeight:600 }}>たまったありがとう</div>
        <div style={{ color:C.amber, fontFamily:DISPLAY, fontSize:30, fontWeight:700 }}>
          {thanksPosts.length}<span style={{ fontSize:14, color:C.mutedOnDark, fontFamily:BODY }}> 個</span>
        </div>
      </div>
      {thanksPosts.length===0 ? (
        <Card><div style={{ color:C.inkSoft, fontSize:14, textAlign:"center", lineHeight:1.8, padding:8 }}>
          まだ空っぽ。<br />「流れ」タブで🧡を選んで書くと、ここに1枚ずつたまっていくよ。
        </div></Card>
      ) : thanksPosts.map((p,i)=>(
        <div key={p.id} style={{ background: i%2===0?C.card:C.card2, border:`1px solid ${C.cardLine}`, borderRadius:4,
          padding:"12px 14px", transform:`rotate(${i%2===0?-0.6:0.5}deg)`, boxShadow:"0 2px 6px rgba(0,0,0,0.28)", color:C.ink }}>
          <div style={{ fontSize:11, color:C.plum, fontWeight:700, marginBottom:3 }}>{fmtLong(p.date)} {fmtTime(p.ts)}</div>
          <div style={{ fontSize:14, lineHeight:1.7, whiteSpace:"pre-wrap" }}>{p.text}</div>
          {p.photo && <Photo src={p.photo} style={{ width:"100%", borderRadius:8, marginTop:8, display:"block" }} />}
        </div>
      ))}
    </div>
  );

  /* ============ やりたい ============ */
  const renderWish = () => {
    const active = db.wishlist.filter((w)=>!w.doneAt);
    const done = db.wishlist.filter((w)=>w.doneAt).sort((a,b)=>(a.doneAt<b.doneAt?1:-1));
    const add = () => {
      if (!newWish.trim()) return;
      saveWishlist([{ id:`w${Date.now()}`, text:newWish.trim(), createdAt:todayKey, doneAt:null }, ...db.wishlist]);
      setNewWish("");
    };
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ textAlign:"center", padding:"6px 0 2px" }}>
          <div style={{ fontSize:34 }}>🌈</div>
          <div style={{ fontFamily:DISPLAY, fontSize:20, color:C.textOnDark, fontWeight:600 }}>やりたいこと貯金</div>
        </div>
        <Card>
          <div style={{ display:"flex", gap:8 }}>
            <input value={newWish} onChange={(e)=>setNewWish(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}
              placeholder="思いついたことをポンと" style={{ ...inputStyle, flex:1 }} />
            <button onClick={add} style={{ background:C.amber, border:"none", borderRadius:10, padding:"0 16px",
              fontWeight:700, fontSize:15, color:"#2A2313", fontFamily:BODY, cursor:"pointer", flexShrink:0 }}>追加</button>
          </div>
        </Card>
        <Card>
          <Label>やりたいこと（{active.length}個）</Label>
          {active.length===0 ? (
            <div style={{ color:"#C9C0AC", fontSize:14, textAlign:"center", padding:8 }}>まだ空っぽ。なんでも入れてOK🍜</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {active.map((w)=>(
                <div key={w.id} style={{ display:"flex", alignItems:"center", gap:8, background:"#FFFDF6",
                  border:`1px solid ${C.cardLine}`, borderRadius:10, padding:"10px 12px" }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:15, color:C.ink, lineHeight:1.5 }}>{w.text}</div>
                    <div style={{ fontSize:10, color:C.inkSoft }}>{fmtShort(w.createdAt)} に追加</div>
                  </div>
                  <button onClick={()=>saveWishlist(db.wishlist.map((x)=>x.id===w.id?{...x,doneAt:todayKey}:x))}
                    style={{ background:"#E4EEDB", border:`1px solid ${C.green}`, borderRadius:999, padding:"6px 10px",
                      fontSize:12, fontWeight:700, color:C.greenDark, fontFamily:BODY, cursor:"pointer", flexShrink:0 }}>叶った！</button>
                  <button onClick={()=>{ if(window.confirm("削除する？")) saveWishlist(db.wishlist.filter((x)=>x.id!==w.id)); }}
                    style={{ background:"none", border:"none", color:C.inkSoft, fontSize:14, cursor:"pointer", padding:4 }}>×</button>
                </div>
              ))}
            </div>
          )}
        </Card>
        {done.length>0 && (
          <Card style={{ background:C.card2 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline" }}>
              <Label>🎉 叶ったこと</Label>
              <div style={{ fontFamily:DISPLAY, fontSize:22, fontWeight:700, color:C.greenDark }}>{done.length}</div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {done.map((w,i)=>(
                <div key={w.id} style={{ background: i%2===0?"#FFFDF6":C.card, border:`1px solid ${C.cardLine}`, borderRadius:4,
                  padding:"10px 12px", display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ color:C.greenDark, fontWeight:700 }}>✓</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, color:C.ink }}>{w.text}</div>
                    <div style={{ fontSize:10, color:C.inkSoft }}>{fmtShort(w.doneAt)} に叶った</div>
                  </div>
                  <button onClick={()=>saveWishlist(db.wishlist.map((x)=>x.id===w.id?{...x,doneAt:null}:x))}
                    style={{ background:"none", border:"none", color:C.inkSoft, fontSize:11, cursor:"pointer", fontFamily:BODY }}>戻す</button>
                </div>
              ))}
            </div>
          </Card>
        )}
      </div>
    );
  };

  /* ============ 設定 ============ */
  const renderSettings = () => {
    const add = () => {
      if (!newHabit.trim()) return;
      const h = { id:`h${Date.now()}`, name:newHabit.trim(), freq:newFreq };
      if (newFreq==="weekly") h.target = newTarget;
      saveHabits([...db.habits, h]); setNewHabit("");
    };
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        <Card>
          <Label>続けたい習慣</Label>
          <input value={newHabit} onChange={(e)=>setNewHabit(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&add()}
            placeholder="例：読書／サウナ／筋トレ" style={{ ...inputStyle, marginBottom:10 }} />
          <div style={{ display:"flex", gap:8, marginBottom:10 }}>
            {[["daily","毎日"],["weekly","週◯回"]].map(([f,l])=>(
              <button key={f} onClick={()=>setNewFreq(f)}
                style={{ flex:1, padding:"9px 0", borderRadius:10, border:`2px solid ${newFreq===f?C.amber:C.cardLine}`,
                  background: newFreq===f?"#F0E4CB":"#FFFDF6", fontFamily:BODY, fontSize:14, fontWeight:700, color:C.ink, cursor:"pointer" }}>{l}</button>
            ))}
          </div>
          {newFreq==="weekly" && (
            <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:10, justifyContent:"center" }}>
              <span style={{ fontSize:13, color:C.inkSoft }}>週に</span>
              {[1,2,3,4,5,6].map((n)=>(
                <button key={n} onClick={()=>setNewTarget(n)}
                  style={{ width:32, height:32, borderRadius:"50%", border:`2px solid ${newTarget===n?C.amberDark:C.cardLine}`,
                    background: newTarget===n?C.amber:"#FFFDF6", color: newTarget===n?"#fff":C.ink, fontWeight:700, fontFamily:BODY, cursor:"pointer" }}>{n}</button>
              ))}
              <span style={{ fontSize:13, color:C.inkSoft }}>回</span>
            </div>
          )}
          <button onClick={add} style={{ background:C.amber, border:"none", borderRadius:10, padding:"11px 0", width:"100%",
            fontWeight:700, fontSize:15, color:"#2A2313", fontFamily:BODY, cursor:"pointer" }}>追加する</button>
          {db.habits.length>0 && (
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginTop:12 }}>
              {db.habits.map((h)=>(
                <div key={h.id} style={{ display:"flex", alignItems:"center", gap:8, background:"#FFFDF6",
                  border:`1px solid ${C.cardLine}`, borderRadius:10, padding:"10px 12px" }}>
                  <span style={{ fontSize:15, color:C.ink, flex:1 }}>{h.name}</span>
                  <span style={{ fontSize:11, fontWeight:700, color: habitFreq(h)==="daily"?C.amberDark:C.greenDark,
                    background: habitFreq(h)==="daily"?"#F5E7CC":"#E4EEDB", borderRadius:999, padding:"3px 9px" }}>
                    {habitFreq(h)==="daily"?"毎日":`週${h.target||1}回`}
                  </span>
                  <button onClick={()=>{ if(window.confirm(`「${h.name}」を削除する？`)) saveHabits(db.habits.filter((x)=>x.id!==h.id)); }}
                    style={{ background:"none", border:"none", color:C.inkSoft, fontSize:13, cursor:"pointer", fontFamily:BODY }}>削除</button>
                </div>
              ))}
            </div>
          )}
        </Card>

        <Card style={{ background:C.card2 }}>
          <Label>💾 バックアップ（かんたん・設定いらず）</Label>
          <div style={{ fontSize:13, color:C.inkSoft, lineHeight:1.7, marginBottom:10 }}>
            月イチでこれを押してファイルを保存しておけば、記録は守れるよ
          </div>
          <button onClick={exportBackup} style={{ width:"100%", background:C.amber, border:"none", borderRadius:10,
            padding:"11px 0", fontWeight:700, fontSize:15, color:"#2A2313", fontFamily:BODY, cursor:"pointer" }}>
            バックアップを書き出す
          </button>
          <label style={{ display:"block", marginTop:8, width:"100%", background:"#FFFDF6", border:`1px solid ${C.cardLine}`,
            borderRadius:10, padding:"11px 0", fontWeight:700, fontSize:14, color:C.ink, fontFamily:BODY, cursor:"pointer", textAlign:"center" }}>
            バックアップを読み込む
            <input type="file" accept="application/json" style={{ display:"none" }} onChange={(e)=>importBackup(e.target.files && e.target.files[0])} />
          </label>
        </Card>

        <Card>
          <Label>📊 スプレッドシート連携（あとでOK）</Label>
          <div style={{ fontSize:13, color:C.inkSoft, lineHeight:1.7, marginBottom:8 }}>
            繋がなくても普通に使えるよ。繋ぐと、書いた記録がシートにも自動でたまる
          </div>
          <input value={urlDraft} onChange={(e)=>setUrlDraft(e.target.value)}
            placeholder="https://script.google.com/macros/s/…/exec" style={{ ...inputStyle, fontSize:12 }} />
          <div style={{ display:"flex", gap:8, marginTop:10 }}>
            <button onClick={testConnection} style={{ flex:1, background:C.amber, border:"none", borderRadius:10,
              padding:"10px 0", fontWeight:700, fontSize:14, color:"#2A2313", fontFamily:BODY, cursor:"pointer" }}>接続テスト</button>
            {gasUrl && (
              <button onClick={pushAll} style={{ flex:1, background:"#FFFDF6", border:`1px solid ${C.cardLine}`, borderRadius:10,
                padding:"10px 0", fontWeight:700, fontSize:14, color:C.ink, fontFamily:BODY, cursor:"pointer" }}>全部シートへ送る</button>
            )}
          </div>
          {syncMsg && <div style={{ fontSize:13, color:C.ink, marginTop:8, fontWeight:700 }}>{syncMsg}</div>}
        </Card>

        <div style={{ fontSize:12, color:C.mutedOnDark, textAlign:"center", lineHeight:1.8 }}>
          記録はこの端末に自動保存されるよ。<br />ホーム画面に追加すればアプリみたいに開ける📱
        </div>
      </div>
    );
  };

  /* ============ レイアウト ============ */
  const TABS = [
    { id:"flow", label:"流れ", icon:"🌙" },
    { id:"review", label:"振り返り", icon:"📖" },
    { id:"thanks", label:"ありがとう", icon:"🧡" },
    { id:"wish", label:"やりたい", icon:"🌈" },
    { id:"settings", label:"設定", icon:"⚙️" },
  ];

  return (
    <div style={{ minHeight:"100vh", background:C.bg, fontFamily:BODY }}>
      <header style={{ padding:"18px 20px 8px", maxWidth:480, margin:"0 auto", display:"flex", alignItems:"baseline", justifyContent:"space-between" }}>
        <div>
          <span style={{ fontFamily:DISPLAY, fontSize:23, color:C.amber, fontWeight:700 }}>ひとひ帳</span>
          <span style={{ fontSize:11, color:C.mutedOnDark, marginLeft:10 }}>思ったとき、ひと言だけ</span>
        </div>
      </header>

      {flash && (
        <div style={{ position:"fixed", top:14, left:0, right:0, display:"flex", justifyContent:"center", zIndex:50, pointerEvents:"none" }}>
          <div style={{ background:C.green, color:"#fff", borderRadius:999, padding:"8px 18px", fontSize:14, fontWeight:700, boxShadow:"0 4px 14px rgba(0,0,0,0.4)" }}>{flash}</div>
        </div>
      )}

      <main style={{ maxWidth:480, margin:"0 auto", padding:"8px 16px 96px" }}>
        {tab==="flow" && renderFlow()}
        {tab==="review" && renderReview()}
        {tab==="thanks" && renderThanks()}
        {tab==="wish" && renderWish()}
        {tab==="settings" && renderSettings()}
      </main>

      <nav style={{ position:"fixed", bottom:0, left:0, right:0, background:C.panel, borderTop:`1px solid ${C.line}`,
        padding:"8px 0 max(10px, env(safe-area-inset-bottom))" }}>
        <div style={{ maxWidth:480, margin:"0 auto", display:"flex" }}>
          {TABS.map((t)=>(
            <button key={t.id} onClick={()=>{ setTab(t.id); window.scrollTo({top:0}); }}
              style={{ flex:1, background:"none", border:"none", cursor:"pointer", padding:"4px 0", fontFamily:BODY }}>
              <div style={{ fontSize:20, filter: tab===t.id?"none":"grayscale(1) opacity(0.55)" }}>{t.icon}</div>
              <div style={{ fontSize:10, fontWeight: tab===t.id?700:400, color: tab===t.id?C.amber:C.mutedOnDark }}>{t.label}</div>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
