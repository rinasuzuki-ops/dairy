<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ひとひ帳</title>
<meta name="theme-color" content="#1A1E2C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ひとひ帳" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1A1E2C; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  textarea:focus, input:focus { border-color: #E3A552 !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============ パレット・フォント ============ */
const C = {
  bg: "#1A1E2C", panel: "#232939", line: "#313A52",
  card: "#F6F0E1", card2: "#F3E8DA", cardLine: "#E2D7BF",
  ink: "#3B342A", inkSoft: "#84796A",
  amber: "#E3A552", amberDark: "#B97F33", plum: "#C96F5E",
  textOnDark: "#EAE5D7", mutedOnDark: "#8E96AB",
  green: "#7FA96B", greenDark: "#5E8A4C",
};
const DISPLAY = "'Shippori Mincho', serif";
const BODY = "'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif";

/* ============ 日付ユーティリティ ============ */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const fmtLong = (key) => { const d = fromKey(key); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const fmtShort = (key) => { const d = fromKey(key); return `${d.getMonth() + 1}/${d.getDate()}`; };
const mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekDaysOf = (mondayKey) => Array.from({ length: 7 }, (_, i) => toKey(addDays(fromKey(mondayKey), i)));
const monthLabel = (m) => `${m.slice(0, 4)}年${Number(m.slice(5, 7))}月`;
const shiftMonth = (m, n) => { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

/* ============ 人としての日替わり質問 ============ */
const PROMPTS = [
  "今日、誰かに優しくできた？", "感情的にならずにいられた？", "今日いちばん笑ったのはいつ？",
  "誰かの話を最後まで聴けた？", "自分に正直でいられた？", "今日、小さな挑戦をした？",
  "誰かの良いところを見つけた？", "「ありがとう」をちゃんと言葉にできた？", "今日の自分を褒めるなら？",
  "無理してなかった？", "誰かを助けたり、助けられたりした？", "今日、心が動いた瞬間は？",
  "明日の自分に残したい気持ちは？", "今日、手放せたこと・許せたことは？",
];
const promptFor = (key) => {
  const d = fromKey(key);
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return PROMPTS[doy % PROMPTS.length];
};

const MOODS = ["😄", "🙂", "😐", "😮‍💨", "😢"];
const MOOD_VAL = { "😄": 5, "🙂": 4, "😐": 3, "😮‍💨": 2, "😢": 1 };
const moodEmojiFor = (v) => (v >= 4.5 ? "😄" : v >= 3.5 ? "🙂" : v >= 2.5 ? "😐" : v >= 1.5 ? "😮‍💨" : "😢");

const emptyEntry = (date) => ({ date, diary: "", gratitude: "", promptAnswer: "", mood: null, photo: null, habitChecks: {} });
const emptyWeek = (mondayKey) => ({ mondayKey, goalText: "", goalAchieved: false, wins: "", insight: "", nextWeek: "" });
const habitFreq = (h) => h.freq || "daily";
const countChecks = (e) => Object.values((e && e.habitChecks) || {}).filter(Boolean).length;

/* ============ ローカルキャッシュ（旧バージョンからの引っ越し込み） ============ */
const LS_CACHE = "hitohi:v3";
const LS_URL = "hitohi:gasUrl";

function migrateLegacy_() {
  const entries = {}, weeks = {};
  let habits = [], wishlist = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith("hitohi:")) continue;
      let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
      if (k.startsWith("hitohi:entry:")) entries[k.slice(13)] = v;
      else if (k === "hitohi:habits") habits = v || [];
      else if (k === "hitohi:wishlist") wishlist = v || [];
      else if (k.startsWith("hitohi:weekgoal:")) {
        const m = k.slice(16);
        weeks[m] = { ...(weeks[m] || emptyWeek(m)), goalText: (v && v.text) || "", goalAchieved: !!(v && v.achieved) };
      } else if (k.startsWith("hitohi:review:")) {
        const m = k.slice(14);
        weeks[m] = { ...(weeks[m] || emptyWeek(m)), wins: (v && v.wins) || "", insight: (v && v.insight) || "", nextWeek: (v && v.nextWeek) || "" };
      }
    }
  } catch (e) {}
  return {
    entries, weeks, habits, wishlist,
    dirty: { entries: Object.keys(entries), weeks: Object.keys(weeks), habits: habits.length > 0, wishlist: wishlist.length > 0 },
  };
}

function loadCache_() {
  try {
    const raw = localStorage.getItem(LS_CACHE);
    if (raw) {
      const d = JSON.parse(raw);
      return { entries: d.entries || {}, weeks: d.weeks || {}, habits: d.habits || [], wishlist: d.wishlist || [],
        dirty: d.dirty || { entries: [], weeks: [], habits: false, wishlist: false } };
    }
  } catch (e) {}
  return migrateLegacy_();
}

function writeCache_(db) {
  try { localStorage.setItem(LS_CACHE, JSON.stringify(db)); } catch (e) {}
}

/* ============ 写真の圧縮 ============ */
const compressImage = (file) =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        let { width, height } = img;
        if (width > max || height > max) {
          const s = Math.min(max / width, max / height);
          width = Math.round(width * s); height = Math.round(height * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

/* ============ 共通パーツ ============ */
const Card = ({ children, style }) => (
  <div style={{ background: C.card, border: `1px solid ${C.cardLine}`, borderRadius: 16, padding: 16, color: C.ink, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", ...style }}>
    {children}
  </div>
);
const Label = ({ children }) => (
  <div style={{ fontSize: 11, letterSpacing: "0.12em", color: C.inkSoft, marginBottom: 6, fontWeight: 700 }}>{children}</div>
);
const inputStyle = {
  width: "100%", background: "#FFFDF6", border: "1px solid #E2D7BF", borderRadius: 10,
  padding: "10px 12px", fontSize: 15, color: C.ink, fontFamily: BODY, outline: "none", boxSizing: "border-box",
};
const saveBtnStyle = (state) => ({
  background: state === "saved" ? C.green : state === "dirty" ? "#C9A24B" : C.amber,
  color: "#2A2313", border: "none", borderRadius: 14, padding: "13px 0",
  fontSize: 15, fontWeight: 700, fontFamily: BODY, cursor: "pointer", width: "100%", transition: "background 0.2s",
});
const saveBtnText = (state, label) =>
  state === "saving" ? "保存中…" :
  state === "saved" ? "保存＆同期したよ ✓" :
  state === "dirty" ? "端末に保存（シート未同期⚠️）" :
  state === "local" ? "保存したよ ✓" :
  state === "error" ? "保存に失敗… もう一度" : label;
const navArrow = {
  background: "#232939", border: "1px solid #313A52", color: "#EAE5D7",
  borderRadius: 10, width: 38, height: 38, fontSize: 20, cursor: "pointer", fontFamily: BODY,
};
const reviewLabel = { fontSize: 13, fontWeight: 700, color: "#3B342A", marginBottom: 5 };

const Photo = ({ src, style, alt }) => (
  <img src={src} alt={alt || ""} referrerPolicy="no-referrer" style={style} />
);

/* ============ 本体 ============ */
function HitohiJournal() {
  const todayKey = toKey(new Date());
  const [tab, setTab] = useState("today");
  const [subTab, setSubTab] = useState("week"); // 振り返り内: week | month | graph

  const [gasUrl, setGasUrl] = useState(localStorage.getItem(LS_URL) || "");
  const [urlDraft, setUrlDraft] = useState(localStorage.getItem(LS_URL) || "");
  const [db, setDb] = useState(loadCache_);
  const dbRef = useRef(db);
  useEffect(() => { dbRef.current = db; writeCache_(db); }, [db]);

  const [sync, setSync] = useState({ state: gasUrl ? "loading" : "local", msg: "" });
  const [testMsg, setTestMsg] = useState("");

  const [entryDate, setEntryDate] = useState(todayKey);
  const [entry, setEntry] = useState(db.entries[todayKey] || emptyEntry(todayKey));
  const touchedRef = useRef(false);
  const [saveState, setSaveState] = useState("idle");

  const [weekOffset, setWeekOffset] = useState(0);
  const curMonday = toKey(addDays(mondayOf(new Date()), weekOffset * 7));
  const [weekDraft, setWeekDraft] = useState(db.weeks[curMonday] || emptyWeek(curMonday));
  const [weekSaveState, setWeekSaveState] = useState("idle");

  const [monthKey, setMonthKey] = useState(todayKey.slice(0, 7));

  const [newWish, setNewWish] = useState("");
  const [newHabit, setNewHabit] = useState("");
  const [newFreq, setNewFreq] = useState("daily");
  const [newTarget, setNewTarget] = useState(3);

  const dirtyCount = db.dirty.entries.length + db.dirty.weeks.length + (db.dirty.habits ? 1 : 0) + (db.dirty.wishlist ? 1 : 0);

  /* ---- API ---- */
  const apiPost = useCallback(async (payload) => {
    const res = await fetch(gasUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "failed");
    return j;
  }, [gasUrl]);

  const pushEntry = useCallback(async (en) => {
    const isDataPhoto = en.photo && en.photo.startsWith("data:");
    const payload = {
      action: "saveEntry",
      entry: {
        date: en.date, mood: en.mood, diary: en.diary, gratitude: en.gratitude,
        prompt: promptFor(en.date), promptAnswer: en.promptAnswer,
        habitChecks: en.habitChecks, photo: isDataPhoto ? "" : (en.photo || ""),
      },
    };
    if (isDataPhoto) payload.photoBase64 = en.photo;
    const r = await apiPost(payload);
    return r.photoUrl || "";
  }, [apiPost]);

  const markEntryDirty = (date) =>
    setDb((p) => ({ ...p, dirty: { ...p.dirty, entries: Array.from(new Set([...p.dirty.entries, date])) } }));
  const clearEntryDirty = (date) =>
    setDb((p) => ({ ...p, dirty: { ...p.dirty, entries: p.dirty.entries.filter((d) => d !== date) } }));

  /* ---- 未同期分をまとめて再送信 ---- */
  const syncDirty = useCallback(async () => {
    if (!gasUrl) return;
    const d = dbRef.current;
    let restE = [], restW = [], restH = d.dirty.habits, restWi = d.dirty.wishlist;
    for (const date of d.dirty.entries) {
      const en = dbRef.current.entries[date];
      if (!en) continue;
      try {
        const url = await pushEntry(en);
        if (url && en.photo && en.photo.startsWith("data:")) {
          setDb((p) => ({ ...p, entries: { ...p.entries, [date]: { ...p.entries[date], photo: url } } }));
        }
      } catch (e) { restE.push(date); }
    }
    for (const m of d.dirty.weeks) {
      const w = dbRef.current.weeks[m];
      if (!w) continue;
      try { await apiPost({ action: "saveWeek", week: w }); } catch (e) { restW.push(m); }
    }
    if (restH) { try { await apiPost({ action: "saveHabits", habits: dbRef.current.habits }); restH = false; } catch (e) {} }
    if (restWi) { try { await apiPost({ action: "saveWishlist", wishlist: dbRef.current.wishlist }); restWi = false; } catch (e) {} }
    setDb((p) => ({ ...p, dirty: { entries: restE, weeks: restW, habits: restH, wishlist: restWi } }));
    setSync({ state: restE.length || restW.length || restH || restWi ? "error" : "ok", msg: "" });
  }, [gasUrl, pushEntry, apiPost]);

  /* ---- シートから全読み込み ---- */
  const refreshFromServer = useCallback(async () => {
    if (!gasUrl) return;
    setSync({ state: "loading", msg: "" });
    try {
      const res = await fetch(gasUrl + "?action=loadAll");
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "load failed");
      setDb((prev) => {
        const entries = {};
        (r.entries || []).forEach((e) => { entries[e.date] = e; });
        const weeks = {};
        (r.weeks || []).forEach((w) => { weeks[w.mondayKey] = w; });
        prev.dirty.entries.forEach((d) => { if (prev.entries[d]) entries[d] = prev.entries[d]; });
        prev.dirty.weeks.forEach((m) => { if (prev.weeks[m]) weeks[m] = prev.weeks[m]; });
        const habits = prev.dirty.habits ? prev.habits : (r.habits || []);
        const wishlist = prev.dirty.wishlist ? prev.wishlist : (r.wishlist || []);
        return { ...prev, entries, weeks, habits, wishlist };
      });
      setSync({ state: "ok", msg: "" });
      if (!touchedRef.current) {
        setTimeout(() => {
          const en = dbRef.current.entries[entryDate];
          if (en && !touchedRef.current) setEntry(en);
          setWeekDraft(dbRef.current.weeks[curMonday] || emptyWeek(curMonday));
        }, 0);
      }
      setTimeout(() => { syncDirty(); }, 100);
    } catch (err) {
      setSync({ state: "error", msg: String(err && err.message || err) });
    }
  }, [gasUrl]); // eslint-disable-line

  useEffect(() => { if (gasUrl) refreshFromServer(); }, []); // 起動時1回

  /* ---- 日付が変わったらエントリ切り替え ---- */
  useEffect(() => {
    setEntry(dbRef.current.entries[entryDate] || emptyEntry(entryDate));
    touchedRef.current = false;
    setSaveState("idle");
  }, [entryDate]);

  /* ---- 週が変わったら下書き切り替え ---- */
  useEffect(() => {
    setWeekDraft(dbRef.current.weeks[curMonday] || emptyWeek(curMonday));
    setWeekSaveState("idle");
  }, [curMonday]);

  const editEntry = (fn) => { touchedRef.current = true; setEntry(fn); };
  const toggleHabit = (id) => editEntry((e) => ({ ...e, habitChecks: { ...e.habitChecks, [id]: !e.habitChecks[id] } }));

  const onPhoto = async (file) => {
    if (!file) return;
    try {
      const dataUrl = await compressImage(file);
      editEntry((e) => ({ ...e, photo: dataUrl }));
    } catch (e) { alert("写真の読み込みに失敗しました。別の写真で試してください。"); }
  };

  /* ---- 保存：日記 ---- */
  const handleSaveEntry = async () => {
    setSaveState("saving");
    const en = { ...entry };
    setDb((p) => ({ ...p, entries: { ...p.entries, [en.date]: en } }));
    touchedRef.current = false;
    if (!gasUrl) {
      setSaveState("local");
      setTimeout(() => setSaveState("idle"), 2000);
      return;
    }
    try {
      const url = await pushEntry(en);
      if (url && en.photo && en.photo.startsWith("data:")) {
        const en2 = { ...en, photo: url };
        setDb((p) => ({ ...p, entries: { ...p.entries, [en.date]: en2 } }));
        if (entryDate === en.date && !touchedRef.current) setEntry(en2);
      }
      clearEntryDirty(en.date);
      setSync({ state: "ok", msg: "" });
      setSaveState("saved");
    } catch (e) {
      markEntryDirty(en.date);
      setSync({ state: "error", msg: "" });
      setSaveState("dirty");
    }
    setTimeout(() => setSaveState("idle"), 2500);
  };

  /* ---- 保存：週 ---- */
  const handleSaveWeek = async () => {
    setWeekSaveState("saving");
    const w = { ...weekDraft, mondayKey: curMonday };
    setDb((p) => ({ ...p, weeks: { ...p.weeks, [curMonday]: w } }));
    if (!gasUrl) { setWeekSaveState("local"); setTimeout(() => setWeekSaveState("idle"), 2000); return; }
    try {
      await apiPost({ action: "saveWeek", week: w });
      setDb((p) => ({ ...p, dirty: { ...p.dirty, weeks: p.dirty.weeks.filter((m) => m !== curMonday) } }));
      setSync({ state: "ok", msg: "" });
      setWeekSaveState("saved");
    } catch (e) {
      setDb((p) => ({ ...p, dirty: { ...p.dirty, weeks: Array.from(new Set([...p.dirty.weeks, curMonday])) } }));
      setSync({ state: "error", msg: "" });
      setWeekSaveState("dirty");
    }
    setTimeout(() => setWeekSaveState("idle"), 2500);
  };

  /* ---- 保存：習慣・やりたい ---- */
  const saveHabits = async (next) => {
    setDb((p) => ({ ...p, habits: next }));
    if (!gasUrl) return;
    try {
      await apiPost({ action: "saveHabits", habits: next });
      setDb((p) => ({ ...p, dirty: { ...p.dirty, habits: false } }));
    } catch (e) {
      setDb((p) => ({ ...p, dirty: { ...p.dirty, habits: true } }));
      setSync({ state: "error", msg: "" });
    }
  };
  const saveWishlist = async (next) => {
    setDb((p) => ({ ...p, wishlist: next }));
    if (!gasUrl) return;
    try {
      await apiPost({ action: "saveWishlist", wishlist: next });
      setDb((p) => ({ ...p, dirty: { ...p.dirty, wishlist: false } }));
    } catch (e) {
      setDb((p) => ({ ...p, dirty: { ...p.dirty, wishlist: true } }));
      setSync({ state: "error", msg: "" });
    }
  };

  /* ---- 接続テスト ---- */
  const testConnection = async () => {
    const u = urlDraft.trim();
    if (!u) { setTestMsg("URLを入力してね"); return; }
    setTestMsg("接続中…");
    try {
      const r = await (await fetch(u + "?action=ping")).json();
      if (r.ok) {
        localStorage.setItem(LS_URL, u);
        setGasUrl(u);
        setTestMsg("✓ 接続OK！シートから読み込むね");
        setTimeout(() => window.location.reload(), 900);
      } else setTestMsg("✗ 応答が変だよ: " + (r.error || ""));
    } catch (e) { setTestMsg("✗ 接続できない… URLとデプロイ設定（全員アクセス可）を確認してね"); }
  };

  /* ---- 派生データ ---- */
  const gratitudeLog = useMemo(() =>
    Object.values(db.entries)
      .filter((e) => e.gratitude && e.gratitude.trim())
      .map((e) => ({ date: e.date, text: e.gratitude.trim() }))
      .sort((a, b) => (a.date < b.date ? 1 : -1)),
  [db.entries]);

  const onThisDay = useMemo(() => {
    const d = fromKey(entryDate);
    const out = [];
    for (let y = 1; y <= 10; y++) {
      const k = `${d.getFullYear() - y}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const e = db.entries[k];
      if (e && (e.diary || e.promptAnswer || e.photo || e.mood || e.gratitude)) out.push({ years: y, e });
    }
    return out;
  }, [entryDate, db.entries]);

  const weeklyCount = (h, mondayKey) => {
    let c = 0;
    weekDaysOf(mondayKey).forEach((k) => {
      const e = k === entryDate ? entry : db.entries[k];
      if (e && e.habitChecks && e.habitChecks[h.id]) c++;
    });
    return c;
  };

  const canGoNextDay = entryDate < todayKey;

  /* ============ パーツ：習慣行 ============ */
  const HabitRow = ({ h, done, right }) => (
    <button onClick={() => toggleHabit(h.id)}
      style={{ display: "flex", alignItems: "center", gap: 10, background: done ? "#F0E4CB" : "#FFFDF6",
        border: `1px solid ${done ? C.amber : C.cardLine}`, borderRadius: 10, padding: "10px 12px",
        cursor: "pointer", fontFamily: BODY, fontSize: 15, color: C.ink, textAlign: "left", width: "100%" }}>
      <span style={{ width: 22, height: 22, borderRadius: "50%", flexShrink: 0,
        border: `2px solid ${done ? C.amberDark : C.cardLine}`, background: done ? C.amber : "transparent",
        color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700 }}>
        {done ? "✓" : ""}
      </span>
      <span style={{ flex: 1 }}>{h.name}</span>
      {right}
    </button>
  );

  /* ============ タブ：今日 ============ */
  const renderToday = () => {
    const dailyHabits = db.habits.filter((h) => habitFreq(h) === "daily");
    const weeklyHabits = db.habits.filter((h) => habitFreq(h) === "weekly");
    const mon = toKey(mondayOf(fromKey(entryDate)));
    const goal = db.weeks[mon];

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={() => setEntryDate(toKey(addDays(fromKey(entryDate), -1)))} style={navArrow} aria-label="前の日">‹</button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 22, color: C.textOnDark, fontWeight: 600 }}>{fmtLong(entryDate)}</div>
            {entryDate !== todayKey && (
              <button onClick={() => setEntryDate(todayKey)}

  /* ============ 振り返り：週 ============ */

    const pct = scores.length ? Math.round((scores.reduce((a, b) => a + b, 0) / scores.length) * 100) : 0;
    const photos = days.filter((k) => map[k] && map[k].photo);

  /* ============ 振り返り：成長グラフ ============ */
  const renderGraphView = () => {
    const entries = Object.values(db.entries);
    const byMonth = {};
    entries.forEach((e) => {
      const hasContent = e.diary || e.gratitude || e.promptAnswer || e.mood || e.photo || countChecks(e) > 0;
      if (!hasContent) return;
      const m = e.date.slice(0, 7);
      const s = byMonth[m] || (byMonth[m] = { days: 0, checks: 0, moodSum: 0, moodN: 0, thanks: 0 });
      s.days++;
      s.checks += countChecks(e);
      if (e.mood && MOOD_VAL[e.mood]) { s.moodSum += MOOD_VAL[e.mood]; s.moodN++; }
      if (e.gratitude && e.gratitude.trim()) s.thanks++;
    });
    const months = Object.keys(byMonth).sort().slice(-12);
    const maxChecks = Math.max(1, ...months.map((m) => byMonth[m].checks));

    const totalDays = entries.filter((e) => e.diary || e.gratitude || e.promptAnswer || e.mood || e.photo || countChecks(e) > 0).length;
    const totalThanks = gratitudeLog.length;
    const totalWishes = db.wishlist.filter((w) => w.doneAt).length;

    // 過去1年の習慣ごとの実施回数
    const yearAgo = toKey(addDays(new Date(), -365));
    const habitTotals = db.habits.map((h) => {
      let c = 0;
      entries.forEach((e) => { if (e.date >= yearAgo && e.habitChecks && e.habitChecks[h.id]) c++; });
      return { h, c };
    }).sort((a, b) => b.c - a.c);
    const maxHabit = Math.max(1, ...habitTotals.map((x) => x.c));

    const BigNum = ({ num, label }) => (
      <div style={{ flex: 1, textAlign: "center" }}>
        <div style={{ fontFamily: DISPLAY, fontSize: 26, fontWeight: 700, color: C.amberDark }}>{num}</div>
        <div style={{ fontSize: 11, color: C.inkSoft }}>{label}</div>
      </div>
    );

    return (
      <React.Fragment>
        <Card>
          <div style={{ display: "flex" }}>
            <BigNum num={totalDays} label="記録した日" />
            <BigNum num={totalThanks} label="ありがとう" />
            <BigNum num={totalWishes} label="叶ったこと" />
          </div>
        </Card>

        <Card>
          <Label>月ごとのあゆみ（記録日数・習慣・気分・ありがとう）</Label>
          {months.length === 0 ? (
            <div style={{ color: C.inkSoft, fontSize: 14, textAlign: "center", padding: 8 }}>記録がたまると、ここに月ごとの変化が出てくるよ📈</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", fontSize: 10, color: C.inkSoft, fontWeight: 700 }}>
                <div style={{ width: 62 }}></div>
                <div style={{ flex: 1 }}>習慣チェック数</div>
                <div style={{ width: 40, textAlign: "center" }}>記録</div>
                <div style={{ width: 34, textAlign: "center" }}>気分</div>
                <div style={{ width: 34, textAlign: "center" }}>🧡</div>
              </div>
              {months.map((m) => {
                const s = byMonth[m];
                const moodAvg = s.moodN ? s.moodSum / s.moodN : null;
                return (
                  <div key={m} style={{ display: "flex", alignItems: "center", gap: 0 }}>
                    <div style={{ width: 62, fontSize: 12, color: C.ink, fontWeight: 700 }}>
                      {m.slice(2, 4)}年{Number(m.slice(5, 7))}月
                    </div>
                    <div style={{ flex: 1, background: "#EFE8D5", borderRadius: 6, height: 14, overflow: "hidden" }}>
                      <div style={{ width: `${Math.round((s.checks / maxChecks) * 100)}%`, minWidth: s.checks ? 8 : 0, height: "100%", background: C.amber, borderRadius: 6 }} />
                    </div>
                    <div style={{ width: 40, textAlign: "center", fontSize: 12, color: C.inkSoft }}>{s.days}日</div>
                    <div style={{ width: 34, textAlign: "center", fontSize: 14 }}>{moodAvg ? moodEmojiFor(moodAvg) : "—"}</div>
                    <div style={{ width: 34, textAlign: "center", fontSize: 12, color: C.plum, fontWeight: 700 }}>{s.thanks}</div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>

        {habitTotals.length > 0 && (
          <Card>
            <Label>習慣ごとの実施回数（過去1年）</Label>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {habitTotals.map(({ h, c }) => (
                <div key={h.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
                    <span style={{ color: C.ink }}>{h.name}</span>
                    <span style={{ color: C.amberDark, fontWeight: 700 }}>{c}回</span>
                  </div>
                  <div style={{ background: "#EFE8D5", borderRadius: 6, height: 10, overflow: "hidden" }}>
                    <div style={{ width: `${Math.round((c / maxHabit) * 100)}%`, minWidth: c ? 6 : 0, height: "100%", background: habitFreq(h) === "daily" ? C.amber : C.green, borderRadius: 6 }} />
                  </div>
                </div>
              ))}
            </div>
          </Card>
        )}

        <div style={{ fontSize: 12, color: C.mutedOnDark, textAlign: "center", lineHeight: 1.8 }}>
          年単位のもっと細かい集計は、スプレッドシート側で自由にできるよ📊
        </div>
      </React.Fragment>
    );
  };

  /* ============ タブ：振り返り（週／月別／グラフ） ============ */
  const renderReview = () => (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", background: C.panel, borderRadius: 12, padding: 4, border: `1px solid ${C.line}` }}>
        {[["week", "週"], ["month", "月別"], ["graph", "グラフ"]].map(([id, label]) => (
          <button key={id} onClick={() => setSubTab(id)}
            style={{ flex: 1, padding: "8px 0", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: BODY,
              fontSize: 13, fontWeight: 700,
              background: subTab === id ? C.amber : "transparent",
              color: subTab === id ? "#2A2313" : C.mutedOnDark }}>
            {label}
          </button>
        ))}
      </div>
      {subTab === "week" && renderWeekView()}
      {subTab === "month" && renderMonthView()}
      {subTab === "graph" && renderGraphView()}
    </div>
  );

  /* ============ タブ：ありがとう ============ */
  const renderThanks = () => (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ textAlign: "center", padding: "6px 0 2px" }}>
        <div style={{ fontSize: 34 }}>🧡</div>
        <div style={{ fontFamily: DISPLAY, fontSize: 20, color: C.textOnDark, fontWeight: 600 }}>たまったありがとう</div>
        <div style={{ color: C.amber, fontFamily: DISPLAY, fontSize: 30, fontWeight: 700 }}>
          {gratitudeLog.length}
          <span style={{ fontSize: 14, color: C.mutedOnDark, fontFamily: BODY }}> 個</span>
        </div>
      </div>
      {gratitudeLog.length === 0 ? (
        <Card>
          <div style={{ color: C.inkSoft, fontSize: 14, textAlign: "center", lineHeight: 1.8, padding: 8 }}>
            まだ空っぽ。<br />「今日」タブでありがとうを書くと、ここに1枚ずつたまっていくよ。
          </div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {gratitudeLog.map((g, i) => (
            <div key={g.date}
              style={{ background: i % 2 === 0 ? C.card : C.card2, border: `1px solid ${C.cardLine}`, borderRadius: 4,
                padding: "12px 14px", transform: `rotate(${i % 2 === 0 ? -0.6 : 0.5}deg)`,
                boxShadow: "0 2px 6px rgba(0,0,0,0.28)", color: C.ink }}>
              <div style={{ fontSize: 11, color: C.plum, fontWeight: 700, marginBottom: 3 }}>{fmtLong(g.date)}</div>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>{g.text}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  /* ============ タブ：やりたいこと ============ */
  const renderWish = () => {
    const active = db.wishlist.filter((w) => !w.doneAt);
    const done = db.wishlist.filter((w) => w.doneAt).sort((a, b) => (a.doneAt < b.doneAt ? 1 : -1));
    const addWish = () => {
      if (!newWish.trim()) return;
      saveWishlist([{ id: `w${Date.now()}`, text: newWish.trim(), createdAt: todayKey, doneAt: null }, ...db.wishlist]);
      setNewWish("");
    };

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ textAlign: "center", padding: "6px 0 2px" }}>
          <div style={{ fontSize: 34 }}>🌈</div>
          <div style={{ fontFamily: DISPLAY, fontSize: 20, color: C.textOnDark, fontWeight: 600 }}>やりたいこと貯金</div>
          <div style={{ fontSize: 12, color: C.mutedOnDark, marginTop: 2 }}>思いついたらすぐ入れる。叶ったら「叶った！」</div>
        </div>

        <Card>
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newWish} onChange={(e) => setNewWish(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addWish()}
              placeholder="例：糸島の酒蔵めぐり／ソムリエ3次試験…" style={{ ...inputStyle, flex: 1 }} />
            <button onClick={addWish}
              style={{ background: C.amber, border: "none", borderRadius: 10, padding: "0 16px", fontWeight: 700,
                fontSize: 15, color: "#2A2313", fontFamily: BODY, cursor: "pointer", flexShrink: 0 }}>
              追加
            </button>
          </div>
        </Card>

        <Card>
          <Label>やりたいこと（{active.length}個）</Label>
          {active.length === 0 ? (
            <div style={{ color: "#C9C0AC", fontSize: 14, textAlign: "center", padding: 8 }}>まだ空っぽ。なんでも入れてOK🍜</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {active.map((w) => (
                <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 8, background: "#FFFDF6",
                  border: `1px solid ${C.cardLine}`, borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 15, color: C.ink, lineHeight: 1.5 }}>{w.text}</div>
                    <div style={{ fontSize: 10, color: C.inkSoft }}>{fmtShort(w.createdAt)} に追加</div>
                  </div>
                  <button onClick={() => saveWishlist(db.wishlist.map((x) => (x.id === w.id ? { ...x, doneAt: todayKey } : x)))}
                    style={{ background: "#E4EEDB", border: `1px solid ${C.green}`, borderRadius: 999, padding: "6px 10px",
                      fontSize: 12, fontWeight: 700, color: C.greenDark, fontFamily: BODY, cursor: "pointer", flexShrink: 0 }}>
                    叶った！
                  </button>
                  <button onClick={() => { if (window.confirm(`「${w.text}」を削除する？`)) saveWishlist(db.wishlist.filter((x) => x.id !== w.id)); }}
                    style={{ background: "none", border: "none", color: C.inkSoft, fontSize: 14, cursor: "pointer", padding: 4 }} aria-label="削除">
                    ×
                  </button>
                </div>
              ))}
            </div>
          )}
        </Card>

        {done.length > 0 && (
          <Card style={{ background: C.card2 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <Label>🎉 叶ったこと</Label>
              <div style={{ fontFamily: DISPLAY, fontSize: 22, fontWeight: 700, color: C.greenDark }}>
                {done.length}<span style={{ fontSize: 12, fontFamily: BODY, color: C.inkSoft }}> 個</span>
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {done.map((w, i) => (
                <div key={w.id} style={{ background: i % 2 === 0 ? "#FFFDF6" : C.card, border: `1px solid ${C.cardLine}`,
                  borderRadius: 4, padding: "10px 12px", transform: `rotate(${i % 2 === 0 ? 0.5 : -0.5}deg)`,
                  display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: C.greenDark, fontWeight: 700 }}>✓</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, color: C.ink, lineHeight: 1.5 }}>{w.text}</div>
                    <div style={{ fontSize: 10, color: C.inkSoft }}>{fmtShort(w.doneAt)} に叶った</div>
                  </div>
                  <button onClick={() => saveWishlist(db.wishlist.map((x) => (x.id === w.id ? { ...x, doneAt: null } : x)))}
                    style={{ background: "none", border: "none", color: C.inkSoft, fontSize: 11, cursor: "pointer", fontFamily: BODY }}>
                    戻す
                  </button>
                </div>
              ))}
            </div>
          </Card>
        )}
      </div>
    );
  };

  /* ============ タブ：設定（連携＋習慣） ============ */
  const renderSettings = () => {
    const addHabit = () => {
      if (!newHabit.trim()) return;
      const h = { id: `h${Date.now()}`, name: newHabit.trim(), freq: newFreq };
      if (newFreq === "weekly") h.target = newTarget;
      saveHabits([...db.habits, h]);
      setNewHabit("");
    };

    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Card style={{ background: C.card2 }}>
          <Label>📊 スプレッドシート連携</Label>
          <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.7, marginBottom: 8 }}>
            GASのウェブアプリURL（https://script.google.com/macros/s/…/exec）を貼り付けてね
          </div>
          <input value={urlDraft} onChange={(e) => setUrlDraft(e.target.value)}
            placeholder="https://script.google.com/macros/s/…/exec" style={{ ...inputStyle, fontSize: 12 }} />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={testConnection}
              style={{ flex: 1, background: C.amber, border: "none", borderRadius: 10, padding: "10px 0",
                fontWeight: 700, fontSize: 14, color: "#2A2313", fontFamily: BODY, cursor: "pointer" }}>
              接続テスト＆保存
            </button>
            {gasUrl && (
              <button onClick={refreshFromServer}
                style={{ flex: 1, background: "#FFFDF6", border: `1px solid ${C.cardLine}`, borderRadius: 10, padding: "10px 0",
                  fontWeight: 700, fontSize: 14, color: C.ink, fontFamily: BODY, cursor: "pointer" }}>
                読み込み直す
              </button>
            )}
          </div>
          {testMsg && <div style={{ fontSize: 13, color: C.ink, marginTop: 8, fontWeight: 700 }}>{testMsg}</div>}
          <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 10, lineHeight: 1.7 }}>
            {gasUrl ? (
              sync.state === "ok" ? "✓ シートと同期中。記録は全部スプレッドシートに残るよ" :
              sync.state === "loading" ? "…読み込み中" :
              sync.state === "error" ? `⚠️ 同期エラー${sync.msg ? "：" + sync.msg : ""}` : ""
            ) : "まだ未連携。連携するまでは端末内だけに保存されるよ"}
          </div>
          {dirtyCount > 0 && gasUrl && (
            <button onClick={syncDirty}
              style={{ marginTop: 8, width: "100%", background: "#C9A24B", border: "none", borderRadius: 10, padding: "10px 0",
                fontWeight: 700, fontSize: 14, color: "#2A2313", fontFamily: BODY, cursor: "pointer" }}>
              未同期 {dirtyCount}件を再送信する
            </button>
          )}
        </Card>

        <Card>
          <Label>続けたい習慣を追加</Label>
          <div style={{ fontSize: 13, color: C.inkSoft, marginBottom: 10, lineHeight: 1.6 }}>
            「毎日」か「週◯回」を選べるよ（例：読書＝毎日、サウナ＝週1、筋トレ＝週3）
          </div>
          <input value={newHabit} onChange={(e) => setNewHabit(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addHabit()} placeholder="新しい習慣を入力"
            style={{ ...inputStyle, marginBottom: 10 }} />
          <div style={{ display: "flex", gap: 8, marginBottom: 10, alignItems: "center" }}>
            {[["daily", "毎日"], ["weekly", "週◯回"]].map(([f, label]) => (
              <button key={f} onClick={() => setNewFreq(f)}
                style={{ flex: 1, padding: "9px 0", borderRadius: 10,
                  border: `2px solid ${newFreq === f ? C.amber : C.cardLine}`,
                  background: newFreq === f ? "#F0E4CB" : "#FFFDF6",
                  fontFamily: BODY, fontSize: 14, fontWeight: 700, color: C.ink, cursor: "pointer" }}>
                {label}
              </button>
            ))}
          </div>
          {newFreq === "weekly" && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, justifyContent: "center" }}>
              <span style={{ fontSize: 14, color: C.inkSoft }}>週に</span>
              {[1, 2, 3, 4, 5, 6].map((n) => (
                <button key={n} onClick={() => setNewTarget(n)}
                  style={{ width: 34, height: 34, borderRadius: "50%",
                    border: `2px solid ${newTarget === n ? C.amberDark : C.cardLine}`,
                    background: newTarget === n ? C.amber : "#FFFDF6",
                    color: newTarget === n ? "#fff" : C.ink, fontWeight: 700, fontFamily: BODY, fontSize: 14, cursor: "pointer" }}>
                  {n}
                </button>
              ))}
              <span style={{ fontSize: 14, color: C.inkSoft }}>回</span>
            </div>
          )}
          <button onClick={addHabit}
            style={{ background: C.amber, border: "none", borderRadius: 10, padding: "11px 0", width: "100%",
              fontWeight: 700, fontSize: 15, color: "#2A2313", fontFamily: BODY, cursor: "pointer" }}>
            追加する
          </button>
        </Card>

        <Card>
          <Label>いまの習慣</Label>
          {db.habits.length === 0 ? (
            <div style={{ color: "#C9C0AC", fontSize: 14, textAlign: "center", padding: 8 }}>まだ習慣がありません</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {db.habits.map((h) => (
                <div key={h.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                  background: "#FFFDF6", border: `1px solid ${C.cardLine}`, borderRadius: 10, padding: "10px 12px", gap: 8 }}>
                  <span style={{ fontSize: 15, color: C.ink, flex: 1 }}>{h.name}</span>
                  <span style={{ fontSize: 11, fontWeight: 700,
                    color: habitFreq(h) === "daily" ? C.amberDark : C.greenDark,
                    background: habitFreq(h) === "daily" ? "#F5E7CC" : "#E4EEDB",
                    borderRadius: 999, padding: "3px 9px", flexShrink: 0 }}>
                    {habitFreq(h) === "daily" ? "毎日" : `週${h.target || 1}回`}
                  </span>
                  <button onClick={() => {
                      if (window.confirm(`「${h.name}」を削除する？（過去のチェックは残ります）`)) saveHabits(db.habits.filter((x) => x.id !== h.id));
                    }}
                    style={{ background: "none", border: "none", color: C.inkSoft, fontSize: 13, cursor: "pointer", fontFamily: BODY, flexShrink: 0 }}>
                    削除
                  </button>
                </div>
              ))}
            </div>
          )}
        </Card>

        <div style={{ fontSize: 12, color: C.mutedOnDark, textAlign: "center", lineHeight: 1.8 }}>
          連携すると記録はスプレッドシートに、写真はドライブの「ひとひ帳_写真」に保存されるよ。<br />
          端末にも控えを持つから、オフラインでも書ける📱
        </div>
      </div>
    );
  };

  /* ============ レイアウト ============ */
  const TABS = [
    { id: "today", label: "今日", icon: "🌙" },
    { id: "review", label: "振り返り", icon: "📖" },
    { id: "thanks", label: "ありがとう", icon: "🧡" },
    { id: "wish", label: "やりたい", icon: "🌈" },
    { id: "settings", label: "設定", icon: "⚙️" },
  ];

  const syncBadge = !gasUrl
    ? { text: "ローカル", color: C.mutedOnDark }
    : sync.state === "loading" ? { text: "同期中…", color: C.mutedOnDark }
    : dirtyCount > 0 ? { text: `未同期${dirtyCount}件`, color: "#C9A24B" }
    : sync.state === "error" ? { text: "同期エラー", color: C.plum }
    : { text: "同期OK", color: C.green };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: BODY }}>
      <header style={{ padding: "20px 20px 10px", maxWidth: 480, margin: "0 auto",
        display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
        <div>
          <span style={{ fontFamily: DISPLAY, fontSize: 24, color: C.amber, fontWeight: 700 }}>ひとひ帳</span>
          <span style={{ fontSize: 11, color: C.mutedOnDark, marginLeft: 10 }}>1日ひとひ、人としてのわたし</span>
        </div>
        <button onClick={() => setTab("settings")}
          style={{ background: "none", border: "none", fontSize: 11, fontWeight: 700, color: syncBadge.color, cursor: "pointer", fontFamily: BODY }}>
          ● {syncBadge.text}
        </button>
      </header>

      <main style={{ maxWidth: 480, margin: "0 auto", padding: "8px 16px 96px" }}>
        {tab === "today" && renderToday()}
        {tab === "review" && renderReview()}
        {tab === "thanks" && renderThanks()}
        {tab === "wish" && renderWish()}
        {tab === "settings" && renderSettings()}
      </main>

      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.panel,
        borderTop: `1px solid ${C.line}`, padding: "8px 0 max(10px, env(safe-area-inset-bottom))" }}>
        <div style={{ maxWidth: 480, margin: "0 auto", display: "flex" }}>
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ flex: 1, background: "none", border: "none", cursor: "pointer", padding: "4px 0", fontFamily: BODY }}>
              <div style={{ fontSize: 20, filter: tab === t.id ? "none" : "grayscale(1) opacity(0.55)" }}>{t.icon}</div>
              <div style={{ fontSize: 10, fontWeight: tab === t.id ? 700 : 400, color: tab === t.id ? C.amber : C.mutedOnDark }}>{t.label}</div>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HitohiJournal />);
</script>
</body>
</html>
